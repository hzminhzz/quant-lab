economic_mechanism: "The shock_reversal template exploits short-term return reversals driven by temporary demand-supply imbalances in crypto markets. Source alex_W3204386317 documents that cryptocurrencies with low prior-period returns significantly outperform those with high prior-period returns, attributing this to illiquidity-induced reversals. The template operationalizes this by fading large one-hour returns (beyond 2.5x prior 168h volatility) when hourly volume exceeds 1.5x its prior 168h mean, capturing the unwinding of overextended price moves. Source alex_W3197724220 supports the role of extreme returns (MAX effect) in cross-sectional pricing, reinforcing that large intraday moves are prone to reversal. The 4-hour horizon aligns with the documented short-term nature of these reversal patterns."
counterparty_or_friction: "The primary friction is liquidity segmentation in crypto markets, where many tokens trade infrequently and experience price pressure from large trades. As alex_W3204386317 notes, illiquidity causes prices to overshoot and subsequently reverse. Market makers and arbitrageurs act as counterparties, stepping in after extreme moves to restore equilibrium. The volume filter (1.5x prior 168h average) ensures that only moves accompanied by elevated trading activity—indicative of informed or institutional flow—are faded, reducing the risk of fading a genuine fundamental shock."
