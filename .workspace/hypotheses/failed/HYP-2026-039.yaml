hypothesis_id: HYP-2026-039
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Pairwise Correlation Integration & Diversification Risk Premium Basket
strategy_family: cross_sectional_ml
economic_mechanism: >
  Average pairwise return correlation across the cross-section measures an altcoin's systemic market integration and portfolio diversification capacity; altcoins that move in lockstep with the broad market cross-section provide zero diversification to institutional portfolios and trade at deep valuation discounts, yielding an equilibrium forward return premium during calm holding periods. Conversely, altcoins with low average correlation serve as cross-asset diversifiers and trade at persistent valuation premiums. A dollar-neutral 72h basket longing high-correlation altcoins and shorting low-correlation altcoins harvests this correlation risk premium while neutralizing market beta.
counterparty_or_friction: >
  Risk-averse multi-asset institutional desks overpaying for idiosyncratic diversifiers while dumping highly integrated altcoins at steep valuation haircuts.
expected_holding_bars: 72
falsification_criteria: >
  Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
