title: Cross-Sectional Quadratic Market Beta Curvature Basket
strategy_family: cross_sectional_ml
economic_mechanism: >
  Altcoins with negative quadratic beta (concave exposure to Bitcoin returns) decline disproportionately in high-volatility market regimes; in equilibrium, they trade at substantial valuation discounts, offering a robust forward risk premium in a 72h dollar-neutral basket.
counterparty_or_friction: >
  Risk-averse hedgers, noise traders, and forced margin liquidators.
expected_holding_bars: 72
falsification_criteria: >
  Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
