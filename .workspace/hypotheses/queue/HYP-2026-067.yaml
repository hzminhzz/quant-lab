hypothesis_id: HYP-2026-067
contract_id: INDICES_1H_V2
title: AF30 Strategy 9 Multi-Speed EWMAC Trend Following on Global Index Futures
strategy_family: rules_ts
economic_mechanism: >
  Macro index futures exhibit persistent multi-week trends driven by systematic CTA
  capital reallocation, institutional macro hedging, and central bank policy cycles.
  Following Robert Carver AF30 Strategy 9, combining fast (8/32h) and slow (16/64h)
  exponential moving average crossovers (normalized by 0.01) captures multi-horizon
  trend persistence while inverse-volatility sizing and weekly (168h) rebalancing
  limit whipsaw turnover and trading friction.
counterparty_or_friction: >
  Short-term noise traders, liquidity providers absorbing directional inventory,
  and trend-countering hedgers facing adverse selection during sustained macro expansions.
expected_holding_bars: 168
falsification_criteria: >
  Reject at Stage 1 if trade gross edge <= 1.5x one-way friction, Profit Factor < 1.15,
  or bootstrap p >= 0.05. Reject at Stage 3 if Net Sharpe < 0.80, 2x Cost Stress Sharpe < 0.40,
  or Deflated Sharpe Ratio DSR < 0.90.
source_provenance: >
  Robert Carver, Advanced Futures Trading Strategies, Strategy 9 (Multiple Trend Rules / AF30),
  config/sleeves/advanced_futures_30/af30_s09_multiple_trend_rules.yaml.
llm_model_id: omp-gemini-3.8-flash
