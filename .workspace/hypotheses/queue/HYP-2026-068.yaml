hypothesis_id: HYP-2026-068
contract_id: INDICES_1H_V2
title: AF30 Strategy 21 Donchian Channel Breakout on Global Index Futures
strategy_family: rules_ts
economic_mechanism: >
  In global equity index futures, periods of volatility compression and range-bound trading
  frequently resolve into sharp directional expansions as stop-loss orders are triggered
  and institutional trend followers establish momentum positions. Following Robert Carver AF30
  Strategy 21, closing beyond the 20-bar trailing high or low captures early-stage channel
  breakouts, scaled by breakout magnitude and sized inversely to 240-hour trailing volatility
  with a trailing 3x ATR-14 protective stop.
counterparty_or_friction: >
  Range-bound mean reversion liquidity providers, fade traders whose boundary stops are triggered,
  and commercial hedgers supplying initial liquidity into expanding momentum channels.
expected_holding_bars: 24
falsification_criteria: >
  Reject at Stage 1 if trade gross edge <= 1.5x one-way friction, Profit Factor < 1.15,
  or bootstrap p >= 0.05. Reject at Stage 3 if Net Sharpe < 0.80, 2x Cost Stress Sharpe < 0.40,
  or Deflated Sharpe Ratio DSR < 0.90.
source_provenance: >
  Robert Carver, Advanced Futures Trading Strategies, Strategy 21 (Breakout / AF30),
  config/sleeves/advanced_futures_30/af30_s21_breakout.yaml.
llm_model_id: omp-gemini-3.8-flash
