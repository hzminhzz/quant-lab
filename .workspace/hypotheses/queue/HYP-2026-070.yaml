hypothesis_id: HYP-2026-070
contract_id: CRYPTO_MAJORS_1H_V1
title: AF30 Strategy 21 Donchian Channel Breakout on Major Crypto Perpetuals
strategy_family: rules_ts
economic_mechanism: >
  Across 23 liquid crypto perpetual futures, periods of consolidation and volatility compression
  resolve into sharp directional momentum expansions as stop orders are absorbed by directional
  flow. Following Robert Carver AF30 Strategy 21, closing beyond the 20-bar rolling high or low
  captures multi-day breakout continuation, scaled by breakout magnitude and sized inversely
  to 240-hour trailing volatility, protected by a trailing 3x ATR-14 stop with a post-stop reset latch.
counterparty_or_friction: >
  Range-bound mean reversion liquidity providers, fade traders whose channel stops are triggered,
  and liquidation cascades on leveraged perpetual contracts.
expected_holding_bars: 24
falsification_criteria: >
  Reject at Stage 1 if trade gross edge <= 1.5x one-way friction, Profit Factor < 1.15,
  or bootstrap p >= 0.05. Reject at Stage 3 if Net Sharpe < 1.0, 2x Cost Stress Sharpe < 0.50,
  or Deflated Sharpe Ratio DSR < 0.90.
source_provenance: >
  Robert Carver, Advanced Futures Trading Strategies, Strategy 21 (Breakout / AF30),
  config/sleeves/advanced_futures_30/af30_s21_breakout.yaml.
llm_model_id: omp-gemini-3.8-flash
