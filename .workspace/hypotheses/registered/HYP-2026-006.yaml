title: 90-Day High-Water Mark Anchoring Momentum on Crypto Perps
strategy_family: rules_ts
economic_mechanism: >
  Traders anchor on the trailing 90-day high and underreact when positive news pushes price
  near historical peak levels, generating persistent continuation momentum while mitigating long-horizon reversal risk.
counterparty_or_friction: >
  Risk-averse hedgers, noise traders taking premature profits at round numbers, and forced margin liquidators.
