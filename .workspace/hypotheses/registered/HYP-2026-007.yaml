economic_mechanism: >
  Non-economic automated exchange liquidation cascades dump leveraged collateral into thin order books,
  creating extreme downside price dislocations below rolling volatility envelopes that mean-revert
  once forced selling volume exhausts.
counterparty_or_friction: >
  Forced margin liquidators, cascade-following momentum stops, and liquidity-depleted order book depth.
