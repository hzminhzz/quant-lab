  Derivative price diverges from unlevered physical spot clearing under leveraged retail imbalance, reflected in funding rate spikes;
  when basis or funding Z-score reaches statistical extremes, accumulating funding penalties and cash-and-carry arbitrage force mechanical counter-trend convergence.
counterparty_or_friction: >
  Risk-averse hedgers, noise traders, and forced margin liquidators paying excessive funding premium under margin constraints.
