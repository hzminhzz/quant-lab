contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Funding Rate Velocity Dislocation Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  Altcoins undergoing extreme positive 24h funding rate acceleration whose price momentum has stalled
  experience severe mean-reverting drag; longing negative velocity and shorting positive velocity tokens
  in a 48h dollar-neutral basket earns steady alpha.
counterparty_or_friction: >
  Late-stage retail margin speculators paying surging funding costs.
expected_holding_bars: 48
falsification_criteria: >
  Falsified if signal rank IC against forward returns yields HAC t-statistic < 2.0 on the train window,
  or if net returns after 18.0 bps round-trip friction are non-positive.
