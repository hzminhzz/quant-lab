hypothesis_id: HYP-2026-023
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional 90-Day High-Water Mark Anchoring Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  Traders anchor cognitively on the trailing 90-day high-water mark, hesitating to bid prices higher when good news pushes an altcoin near resistance (anchoring underreaction). Once this psychological barrier is cleared, the asset experiences persistent forward drift. Conversely, altcoins far below their 90-day high suffer from severe overhead bagholder supply. A dollar-neutral 72h basket longing tokens closest to their 90-day high and shorting tokens farthest from their 90-day high captures high-water mark momentum without long-horizon crash reversals.
counterparty_or_friction: >
  Anchored market participants prematurely selling breakout winners at resistance and bagholders holding broken tokens that continue to bleed.
expected_holding_bars: 72
falsification_criteria: >
  Falsified if signal rank IC against forward returns yields HAC t-statistic < 2.0 on the train window,
  or if net returns after 18.0 bps round-trip friction are non-positive.
