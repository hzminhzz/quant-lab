hypothesis_id: HYP-2026-026
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Capital Gain Overhang & Disposition Effect Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  The disposition effect creates reference-dependent mispricing: retail traders sitting on paper gains prematurely take profits, holding prices below equilibrium and driving persistent forward drift (CGO > 0), while traders sitting on paper losses refuse to sell, delaying downward price discovery (CGO < 0). A dollar-neutral 72h basket longing high-CGO and shorting low-CGO altcoins captures disposition-driven drift alpha.
counterparty_or_friction: >
  Retail traders prematurely taking small profits on winners and refusing to realize losses on depreciating tokens.
expected_holding_bars: 72
falsification_criteria: >
  Falsified if signal rank IC against forward returns yields HAC t-statistic < 2.0 on the train window,
  or if net returns after 18.0 bps round-trip friction are non-positive.
source_provenance: Adapted from dev/quant/quant-research/research_inbox/crypto_xs_capital_gain_overhang_basket_v1
llm_model_id: claude-sonnet-4-6
status: QUEUED
