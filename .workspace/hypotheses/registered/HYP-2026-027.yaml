hypothesis_id: HYP-2026-027
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Corwin-Schultz Effective Spread Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  Altcoins with wide effective bid-ask spreads estimated via Corwin-Schultz high-low estimators compensate liquidity providers with higher gross returns; a 72h dollar-neutral basket longing wide-spread and shorting tight-spread tokens captures this spread premium.
counterparty_or_friction: >
  Risk-averse hedgers, noise traders, and forced margin liquidators.
expected_holding_bars: 72
falsification_criteria: >
  Falsified if signal rank IC against forward returns yields HAC t-statistic < 2.0 on the train window,
  or if net returns after 18.0 bps round-trip friction are non-positive.
source_provenance: Adapted from dev/quant/quant-research/research_inbox/crypto_xs_corwin_schultz_spread_basket_v1
llm_model_id: claude-sonnet-4-6
