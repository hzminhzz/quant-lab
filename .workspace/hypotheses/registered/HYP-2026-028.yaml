hypothesis_id: HYP-2026-028
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Downside Correlation Asymmetry Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  Altcoins with elevated downside correlation relative to upside correlation with Bitcoin (rho^- - rho^+) offer zero diversification during drawdowns and must offer higher expected returns in equilibrium; a dollar-neutral 72h basket longing high-asymmetry tokens captures this premium.
counterparty_or_friction: >
  Risk-averse hedgers, noise traders, and forced margin liquidators.
expected_holding_bars: 72
falsification_criteria: >
  Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
