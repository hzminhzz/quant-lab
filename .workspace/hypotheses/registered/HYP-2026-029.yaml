hypothesis_id: HYP-2026-029
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Extreme Left-Tail Beta Crash Risk Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  Altcoins with extreme sensitivity to the 5th percentile left-tail market shocks suffer severe crash penalties; longing high-tail-beta and shorting low-tail-beta tokens in a 72h dollar-neutral basket captures this systematic crash risk premium.
counterparty_or_friction: >
  Risk-averse hedgers, noise traders, and forced margin liquidators.
expected_holding_bars: 72
falsification_criteria: >
  Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
source_provenance: Adapted from dev/quant/quant-research/research_inbox/crypto_xs_extreme_tail_beta_basket_v1
