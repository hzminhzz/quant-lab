hypothesis_id: HYP-2026-031
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Idiosyncratic Volatility Discount Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  Altcoins with high idiosyncratic volatility relative to Bitcoin are systematically overpriced by retail lottery demand and limits of arbitrage; a dollar-neutral basket longing low-IVOL and shorting high-IVOL tokens earns substantial risk-adjusted alpha.
counterparty_or_friction: >
  Risk-averse hedgers, noise traders, and forced margin liquidators.
expected_holding_bars: 72
falsification_criteria: >
  Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
source_provenance: Adapted from dev/quant/quant-research/research_inbox/crypto_xs_idiosyncratic_volatility_basket_v1
llm_model_id: claude-sonnet-4-6
status: QUEUED
