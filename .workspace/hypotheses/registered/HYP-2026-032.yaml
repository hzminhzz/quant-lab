hypothesis_id: HYP-2026-032
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Amihud Illiquidity Innovation Shock Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  Asset pricing reacts primarily to unanticipated innovations in liquidity rather than static illiquidity levels; altcoins experiencing an acute positive illiquidity shock suffer severe forced institutional selling into thin order books, depressing prices below fair value. As quotes are replenished and order books normalize, these discounted tokens experience persistent upward mean-reverting drift. Conversely, altcoins experiencing rapid liquidity deepening attract retail crowding and trade at a premium. A dollar-neutral 72h basket longing acute illiquidity shock altcoins and shorting liquidity deepening altcoins captures this recovery premium while eliminating market beta.
counterparty_or_friction: >
  Distressed institutional sellers dumping positions into illiquid books and retail momentum chasers overpaying for temporarily liquid, crowded tokens.
expected_holding_bars: 72
falsification_criteria: >
  Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
