hypothesis_id: HYP-2026-033
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Information Diffusion Delay and Lead-Lag Catch-Up Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  Macro news and institutional capital flows clear first in Bitcoin, diffusing sluggishly to the altcoin cross-section due to fragmented retail attention; a dollar-neutral 48h basket longing altcoins with the highest positive uncompleted information backlog from lagged Bitcoin returns and shorting negative backlog altcoins captures systematic lead-lag catch-up alpha.
counterparty_or_friction: >
  Inattentive altcoin market makers and retail participants trading stale quotes who are adversely selected as macro information finishes diffusing.
expected_holding_bars: 48
falsification_criteria: >
  The hypothesis is falsified if the signal rank IC against forward returns yields HAC t-statistic < 2.0 on the 2019-2023 train window, or if net returns after 18.0 bps round-trip friction are non-positive. Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
source_provenance: Adapted from dev/quant/quant-research/research_inbox/crypto_xs_information_delay_basket_v1
llm_model_id: claude-sonnet-4-6
status: QUEUED
