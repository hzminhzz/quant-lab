hypothesis_id: HYP-2026-034
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Information Discreteness and Frog-in-the-Pan Momentum Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  Momentum generated by continuous, frequent small price changes (low information discreteness) experiences persistent return continuation due to retail inattention, whereas momentum driven by infrequent, discrete price spikes suffers immediate attention crowding and severe reversals; longing low-ID continuous drift altcoins and shorting high-ID jump-driven altcoins in a dollar-neutral 72h basket generates high risk-adjusted alpha.
counterparty_or_friction: >
  Late-stage retail momentum chasers buying parabolic pump wicks and momentum hedgers suffering crash reversals on jump-driven tokens.
expected_holding_bars: 72
falsification_criteria: >
  The hypothesis is falsified if the signal rank IC against forward returns yields HAC t-statistic < 2.0 on the 2019-2023 train window, or if net returns after 18.0 bps round-trip friction are non-positive. Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
source_provenance: Adapted from dev/quant/quant-research/research_inbox/crypto_xs_information_discreteness_fip_basket_v1
llm_model_id: claude-sonnet-4-6
status: QUEUED
