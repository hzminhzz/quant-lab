hypothesis_id: HYP-2026-035
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Kyle's Lambda Order Flow Price Impact Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  Kyle's Lambda non-parametrically quantifies order book illiquidity and adverse selection price impact; altcoins with elevated Kyle's Lambda suffer from thin order depth and severe liquidation execution penalties, forcing institutional capital to demand an equilibrium return premium. A dollar-neutral 72h basket longing high-lambda altcoins and shorting low-lambda altcoins captures this adverse selection risk premium while neutralizing market beta.
counterparty_or_friction: >
  Risk-averse institutional desks overpaying for deep, low-impact tokens and dumping high-impact altcoins at steep valuation haircuts.
expected_holding_bars: 72
falsification_criteria: >
  The hypothesis is falsified if the signal rank IC against forward returns yields HAC t-statistic < 2.0 on the 2019-2023 train window, or if net returns after 18.0 bps round-trip friction are non-positive. Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
source_provenance: Adapted from dev/quant/quant-research/research_inbox/crypto_xs_kyles_lambda_basket_v1
llm_model_id: claude-sonnet-4-6
status: QUEUED
