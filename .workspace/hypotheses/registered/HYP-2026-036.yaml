hypothesis_id: HYP-2026-036
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Liquidity Beta and LCAPM Premium Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  Altcoins whose individual liquidity exhibits high positive covariance with aggregate market illiquidity (high liquidity beta beta^L) experience catastrophic liquidity dry-ups during market downturns; to clear the market, these assets trade at deep structural valuation discounts and yield a substantial forward liquidity risk premium. Longing high-liquidity-beta altcoins and shorting low-liquidity-beta altcoins in a dollar-neutral 72h basket captures the LCAPM liquidity premium while eliminating market beta.
counterparty_or_friction: >
  Risk-averse institutional desks overpaying for defensive liquidity havens and dumping illiquidity-sensitive tokens during market distress.
expected_holding_bars: 72
falsification_criteria: >
  The hypothesis is falsified if the signal rank IC against forward returns yields HAC t-statistic < 2.0 on the 2019-2023 train window, or if net returns after 18.0 bps round-trip friction are non-positive. Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
source_provenance: Adapted from dev/quant/quant-research/research_inbox/crypto_xs_liquidity_beta_lcapm_basket_v1
llm_model_id: claude-sonnet-4-6
status: QUEUED
