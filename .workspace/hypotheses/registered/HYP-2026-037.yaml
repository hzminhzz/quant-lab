hypothesis_id: HYP-2026-037
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Maximum Return Salience Overpricing Basket
strategy_family: cross_sectional_ml
economic_mechanism: >
  Altcoins exhibiting extreme maximum daily return spikes (high MAX) over the trailing 14 days are systematically overvalued by retail lottery-seeking attention and limits to arbitrage; longing low-MAX disciplined altcoins and shorting high-MAX lottery altcoins in a dollar-neutral 72h basket captures post-hype mean-reverting alpha.
counterparty_or_friction: >
  Retail speculators chasing peak leaderboard pumps and paying high borrow/funding fees.
expected_holding_bars: 4
falsification_criteria: >
  Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
