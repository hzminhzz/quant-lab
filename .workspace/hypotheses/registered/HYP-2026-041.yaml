hypothesis_id: HYP-2026-041
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Range Volatility Efficiency Basket
strategy_family: cross_sectional_ml
economic_mechanism: >
  The ratio of high-low Parkinson range volatility to close-to-close realized volatility (RVR = sigma_Parkinson / sigma_CC) diagnoses price path efficiency: altcoins with low RVR translate intrabar range directly into net directional price discovery driven by informed accumulation, whereas altcoins with high RVR suffer violent, non-informational retail whipsaws and stop-hunting noise that fails to yield net displacement. Longing high-efficiency (low-RVR) altcoins and shorting noise-dominated (high-RVR) altcoins in a dollar-neutral 72h basket earns consistent efficiency drift alpha.
counterparty_or_friction: >
  Noise traders and retail momentum chasers whipsawed by wide intraday ranges that mean-revert before bar close.
expected_holding_bars: 4
falsification_criteria: >
  Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
