hypothesis_id: HYP-2026-042
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Realized Kurtosis & Jump-Tail Risk Premium Basket
strategy_family: cross_sectional_ml
economic_mechanism: >
  Altcoins exhibiting elevated fourth-order realized price kurtosis over trailing 7 days reflect leptokurtic jump-tail distributions that risk-averse investors dislike; to clear the market, these fat-tailed tokens trade at a substantial risk discount and earn a positive forward tail risk premium. Longing high-kurtosis and shorting low-kurtosis altcoins in a dollar-neutral 72h basket captures this premium while eliminating directional market beta.
counterparty_or_friction: >
  Risk-averse hedgers and institutional desks overpaying for thin-tailed, predictable variance assets and dumping jump-prone altcoins at steep discounts.
expected_holding_bars: 4
falsification_criteria: >
  Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
