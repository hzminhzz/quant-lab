hypothesis_id: HYP-2026-043
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Realized Quarticity & Volatility Estimation Uncertainty Risk Premium Basket
strategy_family: cross_sectional_ml
economic_mechanism: >
  Realized Quarticity (RQ_i = (168 / 3) * sum(r_{i,t}^4) over trailing 7 days) non-parametrically estimates the asymptotic sampling variance of Realized Variance; altcoins with elevated RQ suffer from severe volatility estimation uncertainty and second-moment instability, forcing institutional risk managers and market makers to demand an equilibrium return premium. A dollar-neutral 72h basket longing high-RQ altcoins and shorting low-RQ altcoins harvests this volatility estimation risk premium while neutralizing market beta.
counterparty_or_friction: >
  Risk-averse institutional desks overpaying for smooth, predictable variance tokens while selling high-quarticity tokens at steep valuation discounts.
expected_holding_bars: 4
falsification_criteria: >
  Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
