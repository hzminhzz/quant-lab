hypothesis_id: HYP-2026-046
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Relative Downside Beta Risk Premium Basket
strategy_family: cross_sectional_ml
economic_mechanism: >
  Altcoins with high relative downside beta (beta^- - beta) relative to Bitcoin crash harder during market drawdowns and must compensate investors with a substantial risk premium; longing high relative downside beta and shorting low relative downside beta tokens in a dollar-neutral 72h basket captures this premium.
counterparty_or_friction: >
  Risk-averse hedgers and institutional investors overpaying for defensive, low-downside-beta tokens and dumping crash-sensitive tokens at deep discounts.
expected_holding_bars: 4
falsification_criteria: >
  Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
