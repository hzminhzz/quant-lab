hypothesis_id: HYP-2026-054
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Taker Order Flow Imbalance and Aggressive Volume Persistence Basket
strategy_family: cross_sectional_ml
economic_mechanism: >
  Aggressive taker orders cross the bid-ask spread to demand immediate execution, reflecting informed capital accumulation or liquidation; altcoins exhibiting persistent positive net taker volume ratios (NTR) experience multi-day upward price drift, while negative NTR altcoins experience persistent downward drag. A dollar-neutral 72h basket longing high-NTR and shorting low-NTR tokens harvests order flow persistence alpha.
counterparty_or_friction: >
  Passive limit order providers quoting adverse spreads and inattentive liquidity providers failing to widen depth as aggressive flow intensifies.
expected_holding_bars: 72
falsification_criteria: >
  Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
