hypothesis_id: HYP-2026-056
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Volatility-of-Volatility Risk Premium Basket
strategy_family: cross_sectional_ml
economic_mechanism: >
  Altcoins with high standard deviation of daily realized volatility over trailing 14 days exhibit severe uncertainty in their second moments; to compensate investors, they trade at a structural valuation discount and deliver forward risk premiums in a 72h dollar-neutral basket. Grounded in Baltussen, van Bekkum & van der Grient (2018), assets with high volatility-of-volatility (vol-of-vol) suffer from severe parameter uncertainty and variance crash risk; longing high vol-of-vol altcoins and shorting low vol-of-vol altcoins in a 72h dollar-neutral basket captures the parameter uncertainty risk premium.
counterparty_or_friction: >
  Risk-averse hedgers, noise traders, and forced margin liquidators.
expected_holding_bars: 72
falsification_criteria: >
  Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
source_provenance: Adapted from dev/quant/quant-research/research_inbox/crypto_xs_vol_of_vol_risk_premium_basket_v1
llm_model_id: claude-sonnet-4-6
status: QUEUED
