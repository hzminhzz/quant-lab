hypothesis_id: HYP-2026-059
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Volatility of Liquidity Risk Premium Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  Altcoins exhibiting highly volatile, unpredictable price impact (high standard deviation of the hourly Amihud illiquidity ratio over trailing 14 days) suffer severe execution air pockets that institutional capital dislikes; to clear the market, these assets trade at deep structural valuation discounts and yield a substantial forward liquidity uncertainty premium. Longing high-VOLIQ and shorting low-VOLIQ altcoins in a dollar-neutral 72h basket captures this premium while hedging directional market beta.
counterparty_or_friction: >
  Risk-averse institutional desks overpaying for predictable, smooth liquidity profiles while dumping assets with fragile, regime-switching liquidity.
expected_holding_bars: 72
falsification_criteria: >
  The hypothesis is falsified if the signal rank IC against forward returns yields HAC t-statistic < 2.0 on the 2019-2023 train window, or if net returns after 18.0 bps round-trip friction are non-positive. Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
source_provenance: Adapted from dev/quant/quant-research/research_inbox/crypto_xs_volatility_of_liquidity_basket_v1
llm_model_id: claude-sonnet-4-6
status: QUEUED
