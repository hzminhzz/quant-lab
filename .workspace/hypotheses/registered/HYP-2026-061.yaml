hypothesis_id: HYP-2026-061
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Trading Volume Volatility and Activity Uncertainty Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  Altcoins with volatile, unpredictable trading volume (high CVV = std(vol)/mean(vol) over trailing 14 days) reflect volatile liquidity provision and speculative disagreement; longing high-CVV and shorting low-CVV tokens in a 72h dollar-neutral basket captures the activity uncertainty risk premium.
counterparty_or_friction: >
  Risk-averse hedgers, noise traders, and forced margin liquidators.
expected_holding_bars: 72
falsification_criteria: >
  The hypothesis is falsified if the signal rank IC against forward returns yields HAC t-statistic < 2.0 on the 2019-2023 train window, or if net returns after 18.0 bps round-trip friction are non-positive. Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
source_provenance: Adapted from dev/quant/quant-research/research_inbox/crypto_xs_volume_volatility_basket_v1
llm_model_id: claude-sonnet-4-6
status: QUEUED
