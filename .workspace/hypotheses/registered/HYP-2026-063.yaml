hypothesis_id: HYP-2026-063
contract_id: CRYPTO_PERPS_TOP100_1H_V1
title: Cross-Sectional Intraday VWAP Tracking Error and Execution Risk Premium Basket on Crypto Perps
strategy_family: cross_sectional_ml
economic_mechanism: >
  Altcoins exhibiting high root-mean-square tracking error relative to their rolling 24-hour VWAP over the trailing 7 days suffer severe institutional execution shortfall and algorithmic penalty costs; to clear the market, these erratic assets trade at deep structural valuation discounts and yield a substantial forward risk premium. Longing high-VTE altcoins and shorting low-VTE altcoins in a dollar-neutral 72h basket captures this execution tracking error premium while eliminating directional market beta.
counterparty_or_friction: >
  Risk-averse hedgers, noise traders, and forced margin liquidators.
expected_holding_bars: 72
falsification_criteria: >
  The hypothesis is falsified if the signal rank IC against forward returns yields HAC t-statistic < 2.0 on the 2019-2023 train window, or if net returns after 18.0 bps round-trip friction are non-positive. Reject at Stage 1 if Mean IC < 0.015 or HAC t-stat < 2.0. Reject at Stage 3 if Net Sharpe < 1.0 or DSR < 0.90.
source_provenance: Adapted from dev/quant/quant-research/research_inbox/crypto_xs_vwap_tracking_error_basket_v1
llm_model_id: claude-sonnet-4-6
status: QUEUED
