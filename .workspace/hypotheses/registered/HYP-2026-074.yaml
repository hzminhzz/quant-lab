hypothesis_id: HYP-2026-074
contract_id: MULTI_ASSET_1H_V1
title: AF30 S04 Buy & Hold Portfolio Scaling on 17-instrument multi-asset 1h panel
strategy_family: rules_ts
economic_mechanism: 'AF30 S04: Long bias: 1.0 (constant long bias); vol_240: 240-hour
  rolling return std, shifted by 1 to prevent lookahead; vol_scaled_long: 0.1 / (vol_240
  + 1e-12); Normalization & scaling: bounded linear, scale 0.5, cap 20.0; Sizing:
  forecast-weighted allocation (weights proportional to forecast * raw_inv_vol), water-filled
  to 0.5 cap, gross exposure 1.0; Trailing stop: 3.0x ATR-14 (long-only); Rebalance
  frequency: 168 hours'
counterparty_or_friction: Counterparty pays a trend risk premium; friction is 1 bp
  one-way taker+slippage on 17 liquid index, FX, metal and crude instruments, plus
  3xATR-14 trailing-stop whipsaw.
expected_holding_bars: 504
falsification_criteria: Stage-1 on MULTI_ASSET_1H_V1 rejects the mechanism when profit_factor
  < 1.15 or trade_edge < 2.5x round-trip cost, or when the 2x-cost stress Sharpe is
  <= 0 or the +1-bar-latency Sharpe is <= 0.
source_provenance: Carver, Advanced Futures Trading Strategies (2022), Strategy 4
