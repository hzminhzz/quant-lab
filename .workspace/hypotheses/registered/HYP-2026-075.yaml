hypothesis_id: HYP-2026-075
contract_id: MULTI_ASSET_1H_V1
title: AF30 S05 Slow Trend Long Only on 17-instrument multi-asset 1h panel
strategy_family: rules_ts
economic_mechanism: 'AF30 S05: Fast EMA: 16, Slow EMA: 64; Long-only constraint: max(trend_raw,
  0); Normalization & scaling: spread divided by 0.01, capped at [0, 20]; Sizing:
  inverse volatility weighting based on 240-hour rolling return std, water-filled
  to 0.5 cap; Trailing stop: 3.0x ATR-14; Rebalance frequency: 504 hours'
counterparty_or_friction: Counterparty pays a trend risk premium; friction is 1 bp
  one-way taker+slippage on 17 liquid index, FX, metal and crude instruments, plus
  3xATR-14 trailing-stop whipsaw.
expected_holding_bars: 504
falsification_criteria: Stage-1 on MULTI_ASSET_1H_V1 rejects the mechanism when profit_factor
  < 1.15 or trade_edge < 2.5x round-trip cost, or when the 2x-cost stress Sharpe is
  <= 0 or the +1-bar-latency Sharpe is <= 0.
source_provenance: Carver, Advanced Futures Trading Strategies (2022), Strategy 5
