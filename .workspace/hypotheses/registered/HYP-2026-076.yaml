title: AF30 S06 Slow Trend Long Short on 17-instrument multi-asset 1h panel
strategy_family: rules_ts
economic_mechanism: 'AF30 S06: Fast EMA: 16, Slow EMA: 64; Symmetric long/short trend:
  (ema_16 - ema_64) / close; Normalization & scaling: spread divided by 0.01, capped
  at [-20, 20]; Sizing: inverse volatility weighting based on 240-hour rolling return
  std, water-filled to 0.5 cap; Trailing stop: 3.0x ATR-14 (symmetric); Rebalance
  frequency: 504 hours'
counterparty_or_friction: Counterparty pays a trend risk premium; friction is 1 bp
  one-way taker+slippage on 17 liquid index, FX, metal and crude instruments, plus
  3xATR-14 trailing-stop whipsaw.
