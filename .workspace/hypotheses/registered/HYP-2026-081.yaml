hypothesis_id: HYP-2026-081
contract_id: MULTI_ASSET_1H_V1
title: AF30 S13 as ported (trend + vol regime, no carry term) on 17-instrument multi-asset
  1h panel
strategy_family: rules_ts
economic_mechanism: 'AF30 S13: Fast EMA: 16, Slow EMA: 64; trend_raw: (ema_16 - ema_64)
  / close; trend_norm: trend_raw / 0.01; vol_240: 240-hour rolling return std, shifted
  by 1 to prevent lookahead; vol_slow: 720-hour rolling mean of vol_240, shifted by
  1 to prevent lookahead; regime_weight: 1.0 when vol_240 < vol_slow else 0.5; regime_trend:
  trend_norm * regime_weight; forecast: (regime_trend / 1.0).clip(-20.0, 20.0); Sizing:
  inverse volatility weighting based on vol_240, water-filled to 0.5 cap; Trailing
  stop: 3.0x ATR-14 (symmetric); Rebalance frequency: 504 hours'
counterparty_or_friction: Counterparty pays a trend risk premium; friction is 1 bp
  one-way taker+slippage on 17 liquid index, FX, metal and crude instruments, plus
  3xATR-14 trailing-stop whipsaw.
expected_holding_bars: 504
falsification_criteria: Stage-1 on MULTI_ASSET_1H_V1 rejects the mechanism when profit_factor
  < 1.15 or trade_edge < 2.5x round-trip cost, or when the 2x-cost stress Sharpe is
  <= 0 or the +1-bar-latency Sharpe is <= 0.
source_provenance: Carver, Advanced Futures Trading Strategies (2022), Strategy 13
llm_model_id: unspecified
strategy_module: strategies/candidates/ts_s13_trend_carry_regimes_1h.py
