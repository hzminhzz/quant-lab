hypothesis_id: HYP-2026-084
contract_id: MULTI_ASSET_1H_V1
title: AF30 S18 Trend Asset Classes on 17-instrument multi-asset 1h panel
strategy_family: rules_ts
economic_mechanism: 'AF30 S18: Pair 1: EMA 16 and 64 -> trend_raw = (ema_16 - ema_64)
  / close -> norm1 = trend_raw / 0.01; Pair 2: EMA 32 and 128 -> trend_slow = (ema_32
  - ema_128) / close -> norm2 = trend_slow / 0.02; multi_horizon_trend: (norm1 + norm2)
  / 2.0; Normalization & scaling: bounded linear with scale=1.0, capped at [-20, 20];
  Sizing: inverse volatility weighting based on 240-hour rolling return std, water-filled
  to 0.5 cap; Trailing stop: 3.0x ATR-14 (symmetric); Rebalance frequency: 504 hours'
counterparty_or_friction: Counterparty pays a trend risk premium; friction is 1 bp
  one-way taker+slippage on 17 liquid index, FX, metal and crude instruments, plus
  3xATR-14 trailing-stop whipsaw.
expected_holding_bars: 504
falsification_criteria: Stage-1 on MULTI_ASSET_1H_V1 rejects the mechanism when profit_factor
  < 1.15 or trade_edge < 2.5x round-trip cost, or when the 2x-cost stress Sharpe is
  <= 0 or the +1-bar-latency Sharpe is <= 0.
source_provenance: Carver, Advanced Futures Trading Strategies (2022), Strategy 18
llm_model_id: unspecified
strategy_module: strategies/candidates/ts_s18_trend_asset_classes_1h.py
