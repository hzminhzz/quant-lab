hypothesis_id: HYP-2026-085
contract_id: MULTI_ASSET_1H_V1
title: AF30 S19 Cross-Sectional Momentum on 17-instrument multi-asset 1h panel
strategy_family: rules_ts
economic_mechanism: 'AF30 S19: Lookback: 24-bar percentage change of close: mom_24
  = close.pct_change(24).over(''asset''); Cross-sectional ranking: xs_mom_rank = mom_24.rank().over(''timestamp'');
  Cross-sectional centering: xs_mom_centered = xs_mom_rank - xs_mom_rank.mean().over(''timestamp'');
  Normalization & scaling: bounded linear (xs_mom_centered / 3.0).clip(-20.0, 20.0);
  Sizing: inverse volatility weighting based on 240-hour rolling return std, water-filled
  to 0.35 cap; Trailing stop: 3.0x ATR-14 (symmetric); Rebalance frequency: 168 hours'
counterparty_or_friction: Counterparty pays a relative-value risk premium; friction
  is 1 bp one-way taker+slippage on 17 liquid index, FX, metal and crude instruments,
  plus 3xATR-14 trailing-stop whipsaw.
expected_holding_bars: 504
falsification_criteria: Stage-1 on MULTI_ASSET_1H_V1 rejects the mechanism when profit_factor
  < 1.15 or trade_edge < 2.5x round-trip cost, or when the 2x-cost stress Sharpe is
  <= 0 or the +1-bar-latency Sharpe is <= 0.
source_provenance: Carver, Advanced Futures Trading Strategies (2022), Strategy 19
llm_model_id: unspecified
strategy_module: strategies/candidates/ts_s19_xs_momentum_1h.py
