title: AF30 S08 Fast Trend with Trend Strength
strategy_family: rules_ts
economic_mechanism: The faster 16/64-day EWMAC with scalar 4.10 and 10% buffering reacts to shorter trends
  and rolls over sooner than the slow filter.
counterparty_or_friction: Fast trends are driven by slower-moving institutional flows; the buffer suppresses
  small forecast changes, and friction is the cost of the remaining faster turnover.
