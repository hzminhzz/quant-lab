title: Top-100 crypto low-realized-volatility cross-sectional anomaly
strategy_family: cross_sectional_ml
economic_mechanism: Cryptocurrencies with high recently realized volatility may be relatively overpriced due to retail lottery demand and constrained arbitrage; lower 24-hour realized volatility may predict higher four-hour subsequent relative returns among equally observable liquid instruments.
counterparty_or_friction: Volatility is strongly associated with illiquidity and small-cap effects, so the apparent factor may vanish after minimum liquidity and futures taker fees, spread, funding and price-impact constraints. The frozen survivor universe is not a point-in-time listing oracle.
