# Experiment spec template. Every key here is read by src/warden/runner.py.
# Place at experiments/active/<hypothesis_id_lowercased>.yaml
#
# New ACTIVE hypotheses MUST implement one of the two inverted causal protocols
# (legacy generate_positions() is frozen for read-only historical replay only):
#   - CausalModelStrategy (cross_sectional_ml / carry_rv / meta_overlay): pipeline + build_estimator(params)
#     See reference baselines: strategies/baselines/causal_ridge_1h.py,
#     strategies/baselines/causal_linear_portfolio_1h.py, strategies/baselines/causal_ipca_1h.py
#   - CausalRulesStrategy (rules_ts / carry_rv / meta_overlay): required_symbols(params) + configure_strategy(contract, params)
#     See reference template: strategies/candidates/causal_rules_drawdown_template.py
contract_id: CONTRACT_ID_HERE
hypothesis_id: HYP-2026-XXX
strategy_name: Human-readable run name
strategy_family: rules_ts          # rules_ts | cross_sectional_ml | carry_rv | meta_overlay; must match registered hypothesis
strategy_module: strategies/candidates/causal_rules_drawdown_template.py
model_type: rules                  # nonlinear/deep models require a logged linear baseline first (deep requires clearing cost-breakeven)
parameters:
  # passed to build_estimator(params) or required_symbols(params) + configure_strategy(contract, params)
  max_drawdown: 0.10
  stop_loss_pct: 0.05
param_grid: []
# If param_grid is empty, Warden records neighbor_tested=False and stability=None.
# 1.5x cost stress is computed analytically; 2.0x is a full Engine re-simulation gate.
# If you supply ±15% neighbours here, each entry is recorded as a selection attempt and counts toward DSR.
