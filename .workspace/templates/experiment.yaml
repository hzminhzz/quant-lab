# Experiment spec template. Every key here is read by src/warden/runner.py.
# Place at experiments/active/<hypothesis_id_lowercased>.yaml
#
# New ACTIVE hypotheses MUST implement one of the two inverted causal protocols
# (legacy generate_positions() is frozen for read-only historical replay only):
#   - CausalModelStrategy (cross_sectional_ml): pipeline + build_estimator(params)
#     See reference baseline: strategies/baselines/causal_ridge_1h.py
#   - CausalRulesStrategy (rules_ts): required_symbols(params) + configure_strategy(contract, params)
#     See reference template: strategies/candidates/causal_rules_drawdown_template.py
contract_id: CONTRACT_ID_HERE
hypothesis_id: HYP-2026-XXX
strategy_name: Human-readable run name
strategy_family: rules_ts          # must equal the registered hypothesis family or run_spec raises
strategy_module: strategies/candidates/causal_rules_drawdown_template.py
model_type: rules                  # cross_sectional_ml must run a linear baseline first (ridge/linear/...)
parameters:
  # passed to build_estimator(params) or required_symbols(params) + configure_strategy(contract, params)
  max_drawdown: 0.10
  stop_loss_pct: 0.05
param_grid: []
# Shortcut: an empty grid records stability=1.0, which is vacuous.
# The harness does NOT run 1.5x costs or +-15% neighbours. If you claim neighbour
# robustness, list the neighbours here — they count as selection attempts, and each
# one raises the DSR hurdle for the whole contract family.
