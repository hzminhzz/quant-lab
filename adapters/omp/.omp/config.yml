# Optional Oh My Pi project settings for quant-lab
skills:
  enableAgentsProject: true
  enableSkillCommands: true
task:
  maxRecursionDepth: 2
  structured: true
modelRoles:
  # Jev is served by OpenRouter at /api/v1/systemone, which is exactly what omp's
  # `typesafe` codec builds from baseUrl https://openrouter.ai/api. The provider lives
  # in ~/.omp/agent/models.yml as openrouter-jev.
  judge: openrouter-jev/typesafe/jev-1.13
