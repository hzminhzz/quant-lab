title: Binance actual average trade-size expansion predicts 72h cross-sectional drift
strategy_family: cross_sectional_ml
economic_mechanism: >-
  Institutional-sized order execution can persist; each hour after completion,
  the relative observed average trade size (sum quote_volume / sum trade_count)
  over the trailing 168 versus 720 calendar hours is a testable predictor of
  72-hour cross-sectional forward next-open price returns. Compare alternative
  72-hour ratio and contemporaneous rank, linear Ridge alpha 10.
counterparty_or_friction: >-
  Informed aggressive trade execution against slower retail inventory; later
  long-high/short-low replication pays spread, fees, impact and funding.
  This signal test is not a venue-fills or profitable-basket result.
expected_holding_bars: 72
falsification_criteria: >-
  Predeclared before evaluation: only actual Binance quote_volume/trade_count
  with zero-trade bars masked at decision time; strictly contiguous 720h data;
  use future entry open at t+1h and exit open at t+73h with no time gaps.
  Fit train-fold-local StandardScaler and Ridge(alpha=10), four purged
  forward folds, 72h label and 72h embargo, no future labels.
  Sample non-overlapping UTC 72-hour decision anchors, require at least
  20 valid altcoin exposures (exclude BTC). Native Warden cross_sectional_ml
  signal gate requires mean IC>=0.015 and HAC t>=2.0. No tuning after seeing
  results, all evaluation previews count toward selection history.
